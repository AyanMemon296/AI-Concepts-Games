<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sim: Hill Climbing</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="game-container">

        <header class="game-header">
            <a href="../../index.html" class="btn-back">&larr; Back to Lab</a>
            <h1>Hill Climbing Visualizer</h1>
        </header>

        <div class="message-area">
            <p id="message">A landscape with all key features. Press 'Start' to run the agent.</p>
        </div>

        <div class="simulation-world">
            <canvas id="landscape-canvas"></canvas>
        </div>
        
        <div class="controls-panel">
            <button id="start-button" class="btn-play">Start Agent</button>
        </div>

    </div>

</body>
</html>
