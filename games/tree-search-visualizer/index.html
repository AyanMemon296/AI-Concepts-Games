<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sim: Tree Search Visualizer</title>
    <link rel="stylesheet" href="style.css"> 
    <script src="script.js" defer></script>
</head>
<body>

    <div class="game-container">

        <header class="game-header">
            <a href="../../index.html" class="btn-back">&larr; Back to Lab</a>
            <h1>Tree Search Visualizer</h1>
        </header>

        <div class="message-area">
            <p id="message">Select a search type to visualize the exploration order.</p>
        </div>

        <div class="simulation-world">
            <canvas id="tree-canvas"></canvas>
        </div>
        
        <div class="controls-panel">
            <button id="restart-button" class="btn-play">Reset</button>
            <button id="bfs-button" class="btn-action">Run BFS</button>
            <button id="dfs-button" class="btn-action">Run DFS</button>
        </div>

    </div>

</body>
</html>
